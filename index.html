<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sistema de Alerta Académica Temprana</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .container{
      width:100%;
      max-width:420px;
      background:#fff;
      padding:36px 28px;
      border-radius:16px;
      text-align:center;
      box-shadow:0 8px 22px rgba(0,0,0,.12);
    }

    .logo{
      max-width:130px;
      margin-bottom:18px;
    }

    h1{
      color:#5a0f1b;
      font-size:24px;
      margin-bottom:8px;
    }

    p{
      color:#555;
      font-size:16px;
      margin-bottom:28px;
    }

    /* BOTONES GRANDES */
    .btn{
      display:block;
      width:100%;
      padding:24px;            /* ⬅️ tamaño clave */
      margin:18px 0;
      font-size:20px;          /* ⬅️ texto grande */
      border-radius:14px;
      text-decoration:none;
      font-weight:600;
      cursor:pointer;
      transition:transform .15s ease, opacity .15s ease;
    }

    .docente{
      background:#5a0f1b;
      color:#fff;
    }

    .tutor{
      background:#444;
      color:#fff;
    }

    .btn:hover{
      opacity:.92;
    }

    .btn:active{
      transform:scale(0.98);
    }

    .footer{
      margin-top:30px;
      font-size:12px;
      color:#777;
      line-height:1.5;
    }

    /* AJUSTE FINO SOLO PARA CELULAR */
    @media (max-width: 600px){

      h1{
        font-size:23px;
      }

      p{
        font-size:16px;
      }

      .btn{
        font-size:21px;
        padding:26px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <img src="logo.svg" alt="CBTis 179" class="logo">

    <h1>Alerta Académica Temprana</h1>
    <p>Sistema institucional de seguimiento y atención académica</p>

    <!-- BOTONES -->
    <a href="formulario_docente.html" class="btn docente">
      👩‍🏫 Levantar reporte académico
    </a>

    <a href="dashboard_tutor.html" class="btn tutor">
      👨‍🏫 Acceso tutores (seguimiento)
    </a>

    <!-- PIE -->
    <div class="footer">
      CBTis 179 · Servicios Escolares<br>
      © Derechos reservados Luis Eduardo Ibarra Hernández<br>
      Uso institucional
    </div>

  </div>

</body>
</html>
