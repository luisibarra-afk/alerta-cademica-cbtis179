<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Alerta Académica Temprana</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f4f4;
}

.container{
  max-width:650px;
  margin:60px auto;
  background:#fff;
  padding:35px;
  border-radius:10px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,0,0,.1);
}

.logo{
  max-width:160px;
  margin-bottom:15px;
}

h1{
  color:#5a0f1b;
  margin-bottom:5px;
}

p{
  color:#555;
  margin-bottom:30px;
}

.btn{
  display:block;
  width:100%;
  padding:15px;
  margin:15px 0;
  font-size:16px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.docente{
  background:#5a0f1b;
  color:#fff;
}

.tutor{
  background:#444;
  color:#fff;
}

.btn:hover{
  opacity:.9;
}

.footer{
  margin-top:30px;
  font-size:12px;
  color:#777;
  line-height:1.4;
}
</style>
</head>

<body>

<div class="container">

  <img src="logo.svg" alt="CBTis 179" class="logo">

  <h1>Alerta Académica Temprana</h1>
  <p>Sistema institucional de seguimiento y atención académica</p>

  <button class="btn docente" onclick="location.href='formulario_docente.html'">
    👩‍🏫 Levantar reporte académico
  </button>

  <button class="btn tutor" onclick="location.href='dashboard_tutor.html'">
    👨‍🏫 Acceso tutores (seguimiento)
  </button>

  <div class="footer">
    CBTis 179 · Servicios Escolares<br>
    © Derechos reservados Luis Eduardo Ibarra Hernández<br>
    Uso institucional
  </div>

</div>

</body>
</html>
