<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerta Académica Temprana</title>

<style>
body{font-family:Arial;background:#f4f4f4}
.form-container{max-width:520px;margin:30px auto;background:#fff;padding:25px;border-radius:8px}
h2{text-align:center;color:#5a0f1b}
label{font-weight:bold;margin-top:12px;display:block}
input,select,textarea{width:100%;padding:10px;margin-top:5px}
button{margin-top:20px;width:100%;padding:14px;background:#5a0f1b;color:#fff;border:none}
</style>
</head>

<body>
<div class="form-container">
<h2>Alerta Académica Temprana</h2>

<form id="alertaForm">
<label>Nombre del alumno</label>
<input type="text" name="nombre_alumno" required>

<label>Especialidad</label>
<select name="especialidad" required>
<option value="">Seleccione</option>
<option>Ciberseguridad</option>
<option>Administración</option>
<option>Arquitectura</option>
<option>Trabajo Social</option>
<option>Electricidad</option>
<option>Mecatrónica</option>
<option>Programación</option>
</select>

<label>Semestre</label>
<select name="semestre" required>
<option value="">Seleccione</option>
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option><option>6</option>
</select>

<label>Turno</label>
<select name="turno" required>
<option value="">Seleccione</option>
<option>Matutino</option>
<option>Vespertino</option>
</select>

<label>Situación detectada</label>
<select name="situacion" required>
<option value="">Seleccione</option>
<option>Riesgo académico</option>
<option>Ausentismo</option>
<option>Indisciplina</option>
</select>

<label>Nivel</label>
<select name="nivel" required>
<option value="">Seleccione</option>
<option>🟢 Preventivo</option>
<option>🟡 Requiere seguimiento</option>
<option>🔴 Urgente</option>
</select>

<label>Comentario</label>
<textarea name="comentario"></textarea>

<button type="submit">Enviar reporte</button>
</form>
</div>

<script>
document.getElementById("alertaForm").addEventListener("submit", e=>{
e.preventDefault();
fetch("https://script.google.com/macros/s/AKfycbwHA-E4SROKyurYKKXyjrenCrarcbzdj3QFBo9L3dUuwiFxOJSOPUfAb19stAzVCCEh/exec
",{
method:"POST",
body:new FormData(e.target)
}).then(()=>{
alert("Reporte enviado");
e.target.reset();
});
});
</script>
</body>
</html>
